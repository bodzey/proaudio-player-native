name: Refresh pure-PipeWire Cargo lock

on:
  push:
    branches: [feature/pure-pipewire]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/pure-pipewire

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Refresh lockfile without changing dependency policy
        run: |
          cargo metadata --format-version=1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh lockfile after Pulse removal"
          git push origin HEAD:feature/pure-pipewire
