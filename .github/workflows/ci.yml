name: Native CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check helper scripts
        run: |
          bash -n scripts/audio-buses.sh
          bash -n scripts/proaudio-player-audioctl
          bash -n scripts/proaudio-player-output-watch

      - name: Check source gain policy
        run: |
          grep -Eq 'mixer_type[[:space:]]+"none"' config/mpd.conf
          grep -Eq 'replay_gain_handler[[:space:]]+"none"' config/mpd.conf
          grep -Eq '^volume_controller[[:space:]]*=[[:space:]]*"none"' config/spotifyd.conf
          grep -Eq 'ignore_volume_control[[:space:]]*=[[:space:]]*"yes"' config/shairport-sync.conf

      - name: Check native PipeWire graph policy
        run: |
          grep -Fq 'support.null-audio-sink' config/pipewire/80-proaudio-buses.conf
          grep -Fq 'node.name = "proaudio_player_music"' config/pipewire/80-proaudio-buses.conf
          grep -Fq 'node.name = "proaudio_player_alert"' config/pipewire/80-proaudio-buses.conf
          grep -Fq 'node.name = "proaudio_player_master"' config/pipewire/80-proaudio-buses.conf
          grep -Fq 'node.name = "proaudio_player_parking"' config/pipewire/80-proaudio-buses.conf
          grep -Fq 'pw-link "$source:monitor_FL" "$target:playback_FL"' scripts/audio-buses.sh
          grep -Fq 'pw-link "$source:monitor_FR" "$target:playback_FR"' scripts/audio-buses.sh
          grep -Fq 'pw-dump -m -N' scripts/proaudio-player-output-watch
          if grep -Eq '\b(pactl|parec|pacat)\b' scripts/audio-buses.sh scripts/proaudio-player-output-watch scripts/proaudio-player-audioctl systemd/proaudio-player-native.service; then
            echo 'Pulse client tools are forbidden in the native PipeWire routing path' >&2
            exit 1
          fi

      - name: Check physical-output safety policy
        run: |
          grep -Fq 'OUTPUT_VOLUME_PERCENT="${OUTPUT_VOLUME_PERCENT:-100}"' scripts/audio-buses.sh
          grep -Fq 'wpctl set-volume "$id" 1.0' scripts/audio-buses.sh
          grep -Fq 'playback_has_zero_percent' scripts/audio-buses.sh
          grep -Fq 'restore_hardware_raw' scripts/audio-buses.sh
          if grep -Eq '^(OUTPUT_HEADROOM_DB|ALERT_MIX_GAIN_DB)=' config/audio.env.example; then
            echo 'fixed hidden attenuation is forbidden in the unity graph' >&2
            exit 1
          fi

      - name: Check processing-rate authority
        run: |
          grep -Eq '^SAMPLE_RATE=[0-9]+$' config/audio.env.example
          grep -Eq '^AUDIO_CHANNELS=[0-9]+$' config/audio.env.example
          if grep -Eq '^[[:space:]]+(sample_rate_mode|sample_rate|allowed_sample_rates|music_sink|alert_sink):' config/config.yaml.example; then
            echo 'audio.env must remain the processing-domain authority' >&2
            exit 1
          fi
          grep -Fq 'required_bus_name(&text, "MUSIC_SINK"' src/processing_domain.rs
          grep -Fq 'required_bus_name(&text, "ALERT_SINK"' src/processing_domain.rs
          grep -Fq 'required_bus_name(&text, "MASTER_SINK"' src/processing_domain.rs

      - name: Check logical meter topology
        run: |
          grep -Fq 'MeterTarget::Master' src/api/meters.rs
          grep -Fq 'DEFAULT_MASTER_SINK.to_owned()' src/api/meters.rs
          grep -Fq 'Command::new("pw-record")' src/api/meters.rs
          if grep -Eq '\b(parec|pacat)\b' src/api/meters.rs; then
            echo 'meters must use the native PipeWire recorder' >&2
            exit 1
          fi

      - name: Check Pulse-free runtime contract
        run: |
          test ! -e src/pulse.rs
          if grep -REn 'PULSE_SERVER|PULSE_SINK|--ao=pulse|pulsesink' src scripts systemd config --exclude='Cargo.lock' --exclude='Cargo.toml'; then
            echo 'Pulse runtime integration remains in shipped native files' >&2
            exit 1
          fi

      - name: Check control-plane fault isolation
        run: |
          grep -Fq 'keep_user_mixer_restored' src/main.rs
          if grep -Eq '^(Requires|PartOf)=proaudio-player-buses.service$' systemd/proaudio-player-native.service; then
            echo 'the control plane must survive logical graph restarts' >&2
            exit 1
          fi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
