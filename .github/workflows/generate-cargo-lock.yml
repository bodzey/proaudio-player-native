name: Generate Cargo lockfile

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force Cargo.lock
          git commit -m "build(native): lock Rust dependencies"
          git push origin HEAD:dev
