# ProAudio Player logical audio buses.
#
# These are native PipeWire virtual sinks. They intentionally exist independently
# of any physical DAC so MUSIC / ALERT / MASTER remain stable across hot-plug.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "proaudio_player_parking"
      node.description = "ProAudio Player Parking Output"
      media.class = "Audio/Sink"
      audio.position = "FL,FR"
      audio.rate = 48000
      monitor.channel-volumes = true
      monitor.passthrough = true
    }
  }
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "proaudio_player_master"
      node.description = "ProAudio Player Final Mix"
      media.class = "Audio/Sink"
      audio.position = "FL,FR"
      audio.rate = 48000
      monitor.channel-volumes = true
      monitor.passthrough = true
    }
  }
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "proaudio_player_music"
      node.description = "ProAudio Player Music Bus"
      media.class = "Audio/Sink"
      audio.position = "FL,FR"
      audio.rate = 48000
      monitor.channel-volumes = true
      monitor.passthrough = true
    }
  }
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "proaudio_player_alert"
      node.description = "ProAudio Player Alert Bus"
      media.class = "Audio/Sink"
      audio.position = "FL,FR"
      audio.rate = 48000
      monitor.channel-volumes = true
      monitor.passthrough = true
    }
  }
]
