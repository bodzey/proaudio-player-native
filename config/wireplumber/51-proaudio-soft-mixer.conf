monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        # Runtime output switching must not power-cycle a DAC/amplifier.
        # Keeping playback nodes open avoids suspend/resume pops.
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
