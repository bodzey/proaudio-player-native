# ProAudio Player is a headless audio appliance. Video capture, Bluetooth
# audio and Bluetooth MIDI are outside the supported runtime contract.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled

    hardware.bluetooth = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
}

# Keep direct rlimit-based realtime available, but do not fall back to
# desktop Portal or RTKit services that are intentionally absent.
module.rt.args = {
  rlimits.enabled = true
  rtportal.enabled = false
  rtkit.enabled = false
}
