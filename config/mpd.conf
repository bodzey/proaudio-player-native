music_directory         "/srv/music"
playlist_directory      "/var/lib/proaudio-player-alert/mpd/playlists"
db_file                 "/var/lib/proaudio-player-alert/mpd/database"
log_file                "syslog"
pid_file                "/var/lib/proaudio-player-alert/mpd/pid"
state_file              "/var/lib/proaudio-player-alert/mpd/state"
sticker_file            "/var/lib/proaudio-player-alert/mpd/sticker.sql"
bind_to_address         "any"
port                    "6600"
auto_update             "yes"
restore_paused          "yes"

audio_output {
    type                "alsa"
    name                "ProAudio Player Music Bus"
    device              "proaudio_music"
    mixer_type          "none"
    replay_gain_handler "none"
}

