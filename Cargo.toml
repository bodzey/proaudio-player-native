[package]
name = "proaudio-player-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native ProAudio network audio player control plane"
publish = false
license-file = "LICENSE"

[features]
default = []
appliance = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
futures-core = "0.3"
futures-util = "0.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libpulse-binding = "=2.30.1"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2.6"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
